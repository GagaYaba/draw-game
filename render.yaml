# Blueprint Render : préproduction (branche develop) et production (branche main).
# `game-preprod` est la préproduction (branche `develop`) et `game-prod` la production (branche
# `main`) : les noms sont ceux du tableau de bord Render. Un écart avec le
# tableau de bord se corrige ici, par PR. Les valeurs des variables ne sont pas versionnées
# (sync: false) ; elles restent saisies dans Render.
version: "1"
services:
  - type: web
    name: game-preprod
    runtime: node
    repo: https://github.com/GagaYaba/draw-game
    branch: develop
    plan: free
    envVars:
      - key: PLAYER_RECONNECT_GRACE_MS
        sync: false
      - key: NODE_ENV
        sync: false
    region: frankfurt
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
  - type: web
    name: game-prod
    runtime: node
    repo: https://github.com/GagaYaba/draw-game
    branch: main
    plan: free
    envVars:
      - key: PLAYER_RECONNECT_GRACE_MS
        sync: false
      - key: NODE_ENV
        sync: false
    region: frankfurt
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
