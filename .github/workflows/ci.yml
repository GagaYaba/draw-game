name: CI

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  branch-policy:
    name: Branch policy
    runs-on: ubuntu-latest
    steps:
      - name: Validate source and destination branches
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo "Branch policy applies to pull requests."
            exit 0
          fi

          if [[ "$BASE_REF" == "main" && ( "$HEAD_REF" != "develop" || "$HEAD_REPOSITORY" != "$REPOSITORY" ) ]]; then
            echo "Pull requests to main must come from develop in the same repository."
            exit 1
          fi

          if [[ "$BASE_REF" == "develop" && ! "$HEAD_REF" =~ ^(feat|fix|chore|docs|test|refactor)/.+$ ]]; then
            echo "Pull requests to develop must use an approved branch prefix."
            exit 1
          fi

          echo "Allowed branch transition: $HEAD_REF -> $BASE_REF"

  formatting:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Use pinned npm version
        run: npm install --global npm@10.9.0

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Use pinned npm version
        run: npm install --global npm@10.9.0

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Use pinned npm version
        run: npm install --global npm@10.9.0

      - name: Install dependencies
        run: npm ci

      - name: Typecheck application
        run: npm run typecheck

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Use pinned npm version
        run: npm install --global npm@10.9.0

      - name: Install dependencies
        run: npm ci

      - name: Build production bundles
        run: npm run build

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Use pinned npm version
        run: npm install --global npm@10.9.0

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

  # Parcours navigateur complet. Ce contrôle n'entre pas dans la synthèse Quality
  # tant qu'il n'est pas ajouté aux protections de branche.
  e2e:
    name: E2E
    runs-on: ubuntu-latest
    # Image officielle : navigateurs et dépendances système déjà installés.
    # Sa version doit rester identique à @playwright/test (package.json).
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Use pinned npm version
        run: npm install --global npm@10.9.0

      - name: Install dependencies
        run: npm ci

      - name: Run end-to-end tests
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  quality:
    name: Quality
    if: always()
    needs:
      - formatting
      - lint
      - typecheck
      - build
      - dependency-audit
    runs-on: ubuntu-latest
    steps:
      - name: Verify all quality checks succeeded
        env:
          FORMATTING_RESULT: ${{ needs.formatting.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          TYPECHECK_RESULT: ${{ needs.typecheck.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          DEPENDENCY_AUDIT_RESULT: ${{ needs['dependency-audit'].result }}
        shell: bash
        run: |
          set -euo pipefail

          for result in \
            "$FORMATTING_RESULT" \
            "$LINT_RESULT" \
            "$TYPECHECK_RESULT" \
            "$BUILD_RESULT" \
            "$DEPENDENCY_AUDIT_RESULT"; do
            if [[ "$result" != "success" ]]; then
              echo "A required quality check did not succeed: $result"
              exit 1
            fi
          done

          echo "All required quality checks succeeded."
